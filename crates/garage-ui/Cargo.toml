[package]
name = "garage-ui"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "garage-ui"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
aws-config = { version = "=1.12.0", default-features = false }
aws-sdk-s3 = { version = "=1.152.0", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-smithy-http-client = { version = "=1.5.0", features = ["rustls-aws-lc"] }
aws-smithy-runtime-api = { version = "=1.19.0", default-features = false, features = ["client", "http-1x"] }
axum = "0.8.9"
bcrypt = "0.19.3"
clap = { version = "4.6.7", features = ["derive"] }
governor = "0.10.4"
http-body = "1.1.0"
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["http1", "server", "service", "tokio"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "avif", "bmp", "ico"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rustls = "=0.23.46"
tokio-rustls = "=0.26.6"
rust-embed = { version = "8.13.0", features = ["interpolate-folder-path"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "signal", "time", "io-util", "sync"] }
zip = "=9.0.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
