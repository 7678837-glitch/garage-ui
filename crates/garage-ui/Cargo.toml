[package]
name = "garage-ui"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "garage-ui"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bcrypt = "0.19.3"
clap = { version = "4.6.7", features = ["derive"] }
governor = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rust-embed = { version = "8.13.0", features = ["interpolate-folder-path"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "signal", "time", "io-util", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
