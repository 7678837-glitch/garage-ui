services:
  # Named volumes start as root; the UI process runs as uid 65532.
  garage-ui-init:
    image: alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
    user: "0:0"
    volumes:
      - garage-ui-data:/data
    command: ["chown", "65532:65532", "/data"]

  garage-ui:
    image: ghcr.io/xjoker/garage-ui:${GARAGE_UI_VERSION:-20261016.3}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    depends_on:
      garage-ui-init:
        condition: service_completed_successfully
      garage-init:
        condition: service_completed_successfully
      garage:
        condition: service_started
    environment:
      GARAGE_ADMIN_URL: http://garage:3903
      API_ADMIN_KEY_FILE: /secrets/admin_token
      METRICS_TOKEN_FILE: /secrets/metrics_token
      S3_ENDPOINT_URL: http://garage:3900
      S3_REGION: garage
      # This demo is published only on loopback over HTTP. Use secure cookies with HTTPS.
      COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:3909:3909"
    volumes:
      - garage-ui-data:/data
      - garage-ui-secrets:/secrets:ro
    read_only: true
    tmpfs:
      - /tmp

  garage-init:
    image: alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
    volumes:
      - garage-config:/config
      - garage-ui-secrets:/ui-secrets
      - ./garage-entrypoint.sh:/garage-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/garage-entrypoint.sh"]

  garage:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    depends_on:
      garage-init:
        condition: service_completed_successfully
    environment:
      GARAGE_CONFIG_FILE: /config/garage.toml
    command: ["/garage", "server", "--single-node"]
    volumes:
      - garage-config:/config:ro
      - garage-data:/var/lib/garage
    ports:
      - "127.0.0.1:3900:3900"
      - "127.0.0.1:3901:3901"
      - "127.0.0.1:3902:3902"
      - "127.0.0.1:3903:3903"

volumes:
  garage-ui-data:
  garage-config:
  garage-ui-secrets:
  garage-data:
