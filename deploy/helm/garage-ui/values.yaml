# Admin UI only. Point garageAdminUrl at a Garage admin API this chart does not install.
# The image is built from deploy/Dockerfile. It listens on 0.0.0.0:3909, runs as uid 65532, and has no shell.
# The process writes its generated session key under /data when no session key file is configured.

image:
  repository: garage-ui
  tag: "20261015.1"
  pullPolicy: IfNotPresent

# Garage admin API base URL. Leave empty until that URL is known.
garageAdminUrl: ""

# Server-reachable Garage S3 API endpoint and its configured region.
# Set both for Garage v2.3/v2.4, which cannot discover them through the admin API.
s3EndpointUrl: ""
s3Region: ""
# Optional browser-reachable endpoint for presigned share links.
s3PublicEndpointUrl: ""

persistence:
  size: 1Gi

# Secret values stay empty in git. Set them at install time from outside the repository.
# Do not commit a token, password, private key, or S3 secret, and do not paste one into this file.
# Store the value outside git, then pass it with --set. For the admin token:
#   helm upgrade --install garage-ui deploy/helm/garage-ui --set secrets.garageAdminToken="$(cat /path/outside/git/admin-token)"
# Use the same form for the other keys. An empty value is omitted from the pod.
# Set s3AccessKeyId and s3SecretAccessKey together, or leave both empty.
# The process rejects a configured secret that is too short or that matches a documented placeholder.
secrets:
  garageAdminToken: ""
  metricsToken: ""
  s3AccessKeyId: ""
  s3SecretAccessKey: ""

# TLS for the Garage API this chart does not install.
# insecure stays false unless the operator sets it. Only true sets GARAGE_TLS_INSECURE to 1.
# An empty caSecret omits the CA. A name mounts that Secret key ca.crt read-only
# at /etc/garage-ui/ca.crt and sets GARAGE_TLS_CA_FILE to that path.
# This chart contains no certificate.
tls:
  insecure: false
  caSecret: ""
