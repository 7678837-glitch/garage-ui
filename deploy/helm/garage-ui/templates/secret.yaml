{{- $keys := dict "garageAdminToken" .Values.secrets.garageAdminToken "metricsToken" .Values.secrets.metricsToken "s3AccessKeyId" .Values.secrets.s3AccessKeyId "s3SecretAccessKey" .Values.secrets.s3SecretAccessKey }}
{{- $present := dict }}
{{- range $name, $value := $keys }}
{{- if $value }}
{{- $_ := set $present $name $value }}
{{- end }}
{{- end }}
{{- if $present }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "garage-ui.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $name, $value := $present }}
  {{ $name }}: {{ $value | toString | b64enc | quote }}
  {{- end }}
{{- end }}
