name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read original workflow run
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/workflow-run.json"
      - name: Assign build identity
        id: identity
        run: |
          python3 - <<'PY_IDENTITY'
          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if not re.fullmatch(r"[0-9a-f]{40}|[0-9a-f]{64}", commit) or commit != os.environ["GITHUB_SHA"]:
              raise SystemExit("Checkout must match the full workflow commit")
          version = Path("VERSION").read_text().removesuffix("\n")
          if not re.fullmatch(r"[0-9]{8}\.[1-9][0-9]*", version):
              raise SystemExit("VERSION must be YYYYMMDD.N")
          datetime.strptime(version[:8], "%Y%m%d")
          version += "-local"
          if os.environ["GITHUB_EVENT_NAME"] == "push" and os.environ["GITHUB_REF"] == "refs/heads/dev":
              run = json.loads((Path(os.environ["RUNNER_TEMP"]) / "workflow-run.json").read_text())
              if (run["id"] != int(os.environ["GITHUB_RUN_ID"])
                  or run["run_number"] != int(os.environ["GITHUB_RUN_NUMBER"])
                  or run["run_number"] < 1 or run["head_sha"] != commit):
                  raise SystemExit("Workflow run identity does not match this checkout")
              created = datetime.strptime(run["created_at"], "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=timezone.utc)
              version = f"{created:%Y%m%d}.{run['run_number']}-dev"
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"version={version}\ncommit={commit}\n")
          receipt = {
              "version": version,
              "git_commit": commit,
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_number": int(os.environ["GITHUB_RUN_NUMBER"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
          }
          (Path(os.environ["RUNNER_TEMP"]) / "build-identity.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY_IDENTITY
      - uses: actions/upload-artifact@v4
        with:
          name: build-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build-identity.json

  check:
    needs: identity
    runs-on: ubuntu-24.04
    env:
      BUILD_VERSION: ${{ needs.identity.outputs.version }}
      GIT_COMMIT: ${{ needs.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - name: frontend
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run lint
          bun run test
          bun run generate:api
          git diff --exit-code -- src/api/garage-admin-v2.ts
          bun audit --prod --audit-level=high
          bun run build
      - name: Build identity regression checks
        run: |
          sh scripts/check-build-identity.sh
          sh scripts/check-dev-version.sh
      - name: rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --workspace
      - name: cargo audit
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit
      - name: Install pinned Gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks_8.30.0_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e "$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Secret scanner regression checks
        run: scripts/check-secret-scan.sh
      - name: Worktree and full-history secret scan
        run: scripts/secret-scan.sh
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: garage-ui:${{ needs.identity.outputs.version }}
          build-args: |
            BUILD_VERSION=${{ needs.identity.outputs.version }}
            GIT_COMMIT=${{ needs.identity.outputs.commit }}

  e2e:
    needs: identity
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        garage-version: [v2.3.0, v2.4.1]
    env:
      BUILD_VERSION: ${{ needs.identity.outputs.version }}
      GIT_COMMIT: ${{ needs.identity.outputs.commit }}
      GARAGE_VERSION: ${{ matrix.garage-version }}
      GARAGE_BROWSER: chromium
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Install browser dependencies
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
      - name: Build the application for browser checks
        run: |
          (cd web && bun run build)
          cargo build -p garage-ui --bin garage-ui
      - name: Pull the selected Garage fixture
        run: docker pull --platform linux/amd64 "dxflrs/garage:$GARAGE_VERSION"
      - name: Disposable real-Garage smoke checks
        run: scripts/e2e-check.sh disposable-smoke.spec.ts --project=chromium
